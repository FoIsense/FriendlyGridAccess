name: Build FriendlyGridAccess

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      PLUGIN_NAME: FriendlyGridAccess
      PLUGIN_GUID: 26f55d62-7b65-4e78-a347-dabf640d66d1
      SE_APP_ID: '298740'
      TORCH_ZIP_URL: https://build.torchapi.com/job/Torch/job/master/lastSuccessfulBuild/artifact/bin/torch-server.zip

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $version = "0.4.0-ci.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building FriendlyGridAccess $version"

      - name: Download SteamCMD
        shell: pwsh
        run: |
          $steamDir = Join-Path $env:RUNNER_TEMP 'steamcmd'
          $steamZip = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
          New-Item -ItemType Directory -Force -Path $steamDir | Out-Null
          Invoke-WebRequest -Uri 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $steamZip
          Expand-Archive $steamZip $steamDir -Force

      - name: Download Space Engineers Dedicated Server assemblies
        shell: pwsh
        run: |
          $steamCmd = Join-Path $env:RUNNER_TEMP 'steamcmd\steamcmd.exe'
          $seRoot = Join-Path $env:RUNNER_TEMP 'se-ds'

          Write-Host "Bootstrapping SteamCMD..."
          & $steamCmd +quit

          # SteamCMD may exit non-zero while performing its first self-update.
          # Run it again after the bootstrap/update has completed.
          Write-Host "Installing Space Engineers Dedicated Server..."
          & $steamCmd `
            +force_install_dir $seRoot `
            +login anonymous `
            +app_update $env:SE_APP_ID validate `
            +quit

          $steamExit = $LASTEXITCODE

          if ($steamExit -ne 0) {
            Write-Warning "SteamCMD returned exit code $steamExit. Checking whether the server files were installed anyway."
          }

          $sandbox = Get-ChildItem $seRoot -Filter 'Sandbox.Game.dll' -File -Recurse |
            Where-Object { $_.FullName -match 'DedicatedServer64' } |
            Select-Object -First 1

          if (-not $sandbox) {
            Write-Host "Contents of Space Engineers install directory:"
            Get-ChildItem $seRoot -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 100 |
              ForEach-Object { Write-Host $_.FullName }

            throw 'Sandbox.Game.dll not found after SteamCMD install.'
          }

          "SE_DIR=$($sandbox.DirectoryName)" >> $env:GITHUB_ENV
          Write-Host "SE assemblies: $($sandbox.DirectoryName)"
          
      - name: Download current Torch assemblies
        shell: pwsh
        run: |
          $torchZip = Join-Path $env:RUNNER_TEMP 'torch-server.zip'
          $torchRoot = Join-Path $env:RUNNER_TEMP 'torch'
          $torchRefs = Join-Path $env:RUNNER_TEMP 'torch-refs'

          Invoke-WebRequest -Uri $env:TORCH_ZIP_URL -OutFile $torchZip
          Expand-Archive $torchZip $torchRoot -Force
          New-Item -ItemType Directory -Force -Path $torchRefs | Out-Null

          $required = @('Torch.API.dll', 'Torch.dll', 'NLog.dll')
          foreach ($name in $required) {
            $found = Get-ChildItem $torchRoot -Filter $name -File -Recurse | Select-Object -First 1
            if (-not $found) { throw "$name not found in downloaded Torch package." }
            Copy-Item $found.FullName (Join-Path $torchRefs $name) -Force
          }

          "TORCH_DIR=$torchRefs" >> $env:GITHUB_ENV
          Write-Host "Torch references staged at: $torchRefs"

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore .\src\FriendlyGridAccess\FriendlyGridAccess.csproj
          if ($LASTEXITCODE -ne 0) { throw 'dotnet restore failed.' }

      - name: Build Release
        shell: pwsh
        run: |
          $args = @(
            'build',
            '.\src\FriendlyGridAccess\FriendlyGridAccess.csproj',
            '-c', 'Release',
            '--no-restore',
            "-p:TorchDir=$env:TORCH_DIR",
            "-p:SEDir=$env:SE_DIR",
            "-p:Version=${{ steps.version.outputs.version }}"
          )
          & dotnet @args
          if ($LASTEXITCODE -ne 0) { throw 'dotnet build failed.' }

      - name: Package Torch plugin
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $out = '.\src\FriendlyGridAccess\bin\Release\net481'
          $stage = '.\dist\package'
          $zip = ".\dist\FriendlyGridAccess-$version.zip"

          Remove-Item .\dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $pluginDll = Join-Path $out 'FriendlyGridAccess.dll'
          if (-not (Test-Path $pluginDll)) { throw "Plugin DLL missing: $pluginDll" }
          Copy-Item $pluginDll $stage -Force

          $pdb = Join-Path $out 'FriendlyGridAccess.pdb'
          if (Test-Path $pdb) { Copy-Item $pdb $stage -Force }

          foreach ($dep in @('0Harmony.dll', 'Lib.Harmony.dll', 'Newtonsoft.Json.dll')) {
            $candidate = Join-Path $out $dep
            if (Test-Path $candidate) { Copy-Item $candidate $stage -Force }
          }

          $manifest = Get-Content .\manifest.xml -Raw
          $manifest = $manifest.Replace('${VERSION}', $version)
          $manifestPath = Join-Path $stage 'manifest.xml'
          Set-Content $manifestPath $manifest -Encoding UTF8

          [xml]$xml = Get-Content $manifestPath
          if ($xml.PluginManifest.Name -ne $env:PLUGIN_NAME) { throw 'Manifest name mismatch.' }
          if ($xml.PluginManifest.Guid -ne $env:PLUGIN_GUID) { throw 'Manifest GUID mismatch.' }

          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          Copy-Item $pluginDll .\dist\FriendlyGridAccess.dll -Force
          Copy-Item $manifestPath .\dist\manifest.xml -Force
          Write-Host "Created $zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FriendlyGridAccess-${{ steps.version.outputs.version }}
          path: |
            dist/FriendlyGridAccess-*.zip
            dist/FriendlyGridAccess.dll
            dist/manifest.xml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/FriendlyGridAccess-*.zip
            dist/FriendlyGridAccess.dll
            dist/manifest.xml
